services:
  - type: web
    name: live-arena-tiktok
    runtime: node
    plan: free
    rootDir: tiktok-live-game
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: TIKTOK_USERNAME
        sync: false
